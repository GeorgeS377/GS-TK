<!DOCTYPE html>
<html>
<script src="/js/first.js"></script>
<head>
    <title>Pacman | 😁GS TK😁</title>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="light dark">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
    <link href="/fonts/fonts.css" rel="stylesheet">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="/games/pacman/logos/css/pacman10-hp.12.css"/>
    <link rel="stylesheet" href="/games/pacman/logos/css/pacman10-hp.11.css"/>
    <link rel="shortcut icon" href="/images/gstklogo.webp">
</head>
<body>
<section class="header">
    <nav>
        <a href="/"><img src="/images/gstklogo.webp" alt=""></a>

        <button class="nav-toggle">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>

        <div class="nav-links" id="navLinks">
            <ul>
                <li><a href="/">Αρχική</a></li>
                <li><a style="pointer-events: none" href="/channels"><img class="under-maintenance"
                                                                          src="/images/etc/icons/under-maintenance.webp"
                                                                          alt="under-maintenance"> Κανάλια</a></li>
                <li><a href="/games">Παιχνίδια</a></li>
                <li><a style="pointer-events: none" href="/tools"><img class="under-maintenance"
                                                                       src="/images/etc/icons/under-maintenance.webp"
                                                                       alt="under-maintenance"> Εργαλεία</a></li>
            </ul>

            <div class="theme-item">
                <button id="themeToggle" class="theme-btn">
                    <img id="themeIcon" class="theme-icon">
                </button>
            </div>
        </div>
    </nav>

    <div class="text-box">
        <div class="pacman-stage">
            <div id="lga">
                <div id="hplogo">
                    <div id="hplogo-l">
                        <div id="hplogo-b"></div>
                    </div>
                </div>
            </div>
        </div>
        <p></p>
        <form name="f" id="pacmanForm" style="display:none;">
            <input name="btnI" id="realInsertCoin" type="submit">
        </form>
        <button class="ngen-btn" id="insertCoinBtn">Εισαγωγή κέρματος</button>
        <a href="https://github.com/ManuelFte/Google-Pacman" class="ngen-btn" target="_blank">Πηγή <img
                class="redirect-icon" src="/images/etc/icons/redirect.webp"></a>
    </div>
</section>

<script type="text/javascript" src="/games/pacman/logos/js/pacman10-hp.12.1.js"></script>
<script>
    document.getElementById("insertCoinBtn").addEventListener("click", () => {
        document.getElementById("realInsertCoin").click();
    });
</script>

<script src="/js/last.js"></script>
</body>
</html>
